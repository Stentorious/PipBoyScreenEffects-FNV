[Blood]

; Toggle blood splatter effect.
bEnable = 1

; Set blood splatter effect brightness.
fBrightness = 1

; Set blood splatter fade time. (In seconds)
fFadeTime = 30

; Health % threshold when blood splatter will begin to appear when hit.
fThreshold = 80


[Water]

; Toggle wet glass effect.
bEnable = 1

; Set wet glass effect brightness.
fBrightness = 1

; Set wet glass fade time. (In seconds)
fFadeTime = 10

; Set wet glass wash time. (In seconds)
fWashTime = 5


[Crack]

; Toggle shattered glass effect.
bEnable = 1

; Set shattered glass effect brightness.
fBrightness = 1

; Armor condition % threshold when the screen will start to crack.
fThreshold = 30


[Dust]

; Toggle dusty glass effect.
bEnable = 1

; Set dusty glass effect brightness.
fBrightness = 1

; Set dusty glass fade time. (In seconds)
fFadeTime = 30
