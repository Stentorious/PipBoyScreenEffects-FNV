[Translations]
$modDisplayName=Pip-Boy Screen Effects
$modDescription=Adds various visual effects to the Pip-Boy screen.
$Blood=Blood Splatter
$Water=Wet Glass
$Crack=Shattered Glass
$Dust=Dusty Glass
$Enable=Enable
$EnableMouse=Enable screen effect.
$Brightness=Brightness
$BrightnessMouse=Set screen effect brightness.
$FadeTime=Fade Time
$BloodFadeTimeMouse=Blood splatter fade duration. (Seconds)
$WaterFadeTimeMouse=Transition time for water accumulation. (Seconds)
$DustFadeTimeMouse=Transition time for dust accumulation. (Seconds)
$WashTime=Wash Time
$WashTimeMouse=Dissipation time for dust and blood effects while screen is wet. (Seconds)
$Threshold=Threshold
$BloodThresholdMouse=Set health %% threshold when blood splatters will start to appear.
$CrackThresholdMouse=Set armor condition %% threshold when the screen will start to crack.